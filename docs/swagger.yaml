basePath: /
definitions:
  http.CreateDeviceRequest:
    properties:
      device_id:
        description: Optional device ID
        type: string
    type: object
  whatsapp.AudioContent:
    properties:
      media:
        allOf:
        - $ref: '#/definitions/whatsapp.MediaData'
        description: Media contains the downloaded audio data and metadata (preferred)
      mimetype:
        description: Mimetype is the audio MIME type (e.g., "audio/ogg")
        type: string
      url:
        description: URL is the WhatsApp media URL for the audio (DEPRECATED - use
          Media field instead)
        type: string
    type: object
  whatsapp.ContactContent:
    properties:
      display_name:
        description: DisplayName is the contact's display name
        type: string
      vcard:
        description: VCard is the full vCard data
        type: string
    type: object
  whatsapp.ContactsContent:
    properties:
      contacts:
        description: Contacts is an array of vCard strings
        items:
          type: string
        type: array
      display_name:
        description: DisplayName is the name shown for the contacts array
        type: string
    type: object
  whatsapp.DocumentContent:
    properties:
      caption:
        description: Caption is the optional document caption
        type: string
      filename:
        description: Filename is the original filename of the document
        type: string
      media:
        allOf:
        - $ref: '#/definitions/whatsapp.MediaData'
        description: Media contains the downloaded document data and metadata (preferred)
      mimetype:
        description: Mimetype is the document MIME type (e.g., "application/pdf")
        type: string
      url:
        description: URL is the WhatsApp media URL for the document (DEPRECATED -
          use Media field instead)
        type: string
    type: object
  whatsapp.FetchMessageHistoryRequest:
    properties:
      before_message_id:
        description: Message ID to fetch before (for pagination)
        type: string
      chat_id:
        type: string
      count:
        description: 'Number of messages to fetch (recommended: 50)'
        type: integer
      device_id:
        type: string
    type: object
  whatsapp.ImageContent:
    properties:
      caption:
        description: Caption is the optional image caption
        type: string
      media:
        allOf:
        - $ref: '#/definitions/whatsapp.MediaData'
        description: Media contains the downloaded image data and metadata (preferred)
      mimetype:
        description: Mimetype is the image MIME type (e.g., "image/jpeg")
        type: string
      url:
        description: URL is the WhatsApp media URL for the image (DEPRECATED - use
          Media field instead)
        type: string
    type: object
  whatsapp.LocationContent:
    properties:
      address:
        description: Address is the optional full address
        type: string
      is_live:
        description: IsLive indicates if this is a live location
        type: boolean
      latitude:
        description: Latitude is the location's latitude
        type: number
      longitude:
        description: Longitude is the location's longitude
        type: number
      name:
        description: Name is the optional location name
        type: string
      url:
        description: URL is the optional map URL
        type: string
    type: object
  whatsapp.MediaData:
    properties:
      data:
        description: Data is the raw bytes of the media file
        items:
          type: integer
        type: array
      filename:
        description: Filename is the suggested filename with extension
        type: string
      mimetype:
        description: Mimetype is the detected MIME type (e.g., "image/jpeg", "video/mp4")
        type: string
      sha256:
        description: SHA256 is the hex-encoded SHA256 hash of the media data
        type: string
      size:
        description: Size is the size of the media in bytes
        type: integer
      whatsapp_url:
        description: WhatsAppURL is the original WhatsApp media URL (DEPRECATED -
          use Data field instead)
        type: string
    type: object
  whatsapp.MessageHistoryResponse:
    properties:
      count:
        type: integer
      messages:
        items:
          $ref: '#/definitions/whatsapp.MessagePayload'
        type: array
      request_id:
        description: Unique ID to track this request
        type: string
    type: object
  whatsapp.MessagePayload:
    properties:
      audio:
        $ref: '#/definitions/whatsapp.AudioContent'
      chat_id:
        type: string
      chat_name:
        description: Group name for groups, contact name for DM
        type: string
      contact:
        $ref: '#/definitions/whatsapp.ContactContent'
      contacts:
        $ref: '#/definitions/whatsapp.ContactsContent'
      document:
        $ref: '#/definitions/whatsapp.DocumentContent'
      from_me:
        type: boolean
      has_media:
        type: boolean
      image:
        $ref: '#/definitions/whatsapp.ImageContent'
      is_forwarded:
        description: IsForwarded reports ContextInfo.IsForwarded
        type: boolean
      is_group:
        type: boolean
      location:
        $ref: '#/definitions/whatsapp.LocationContent'
      message_id:
        type: string
      poll:
        $ref: '#/definitions/whatsapp.PollContent'
      poll_vote:
        $ref: '#/definitions/whatsapp.PollVoteContent'
      protocol:
        $ref: '#/definitions/whatsapp.ProtocolContent'
      push_name:
        description: Original PushName from WhatsApp
        type: string
      quoted:
        allOf:
        - $ref: '#/definitions/whatsapp.QuotedMessage'
        description: Quoted is set when this message is a reply to another message
      reaction:
        $ref: '#/definitions/whatsapp.ReactionContent'
      sender:
        type: string
      sender_name:
        description: Full name or PushName of sender
        type: string
      sticker:
        $ref: '#/definitions/whatsapp.StickerContent'
      text:
        $ref: '#/definitions/whatsapp.TextContent'
      timestamp:
        type: integer
      type:
        description: '"text", "image", "video", "audio", "document", "sticker", "contact",
          "contacts", "location", "live_location", "reaction", "poll", "poll_vote",
          "protocol", "unknown"'
        type: string
      video:
        $ref: '#/definitions/whatsapp.VideoContent'
    type: object
  whatsapp.MessageResponse:
    properties:
      message_id:
        type: string
    type: object
  whatsapp.PollContent:
    properties:
      name:
        description: Name is the poll question
        type: string
      options:
        description: Options are the available poll options
        items:
          $ref: '#/definitions/whatsapp.PollOption'
        type: array
      selectable_count:
        description: SelectableCount is the maximum number of options that can be
          selected
        type: integer
    type: object
  whatsapp.PollOption:
    properties:
      name:
        description: Name is the option text
        type: string
    type: object
  whatsapp.PollVoteContent:
    properties:
      poll_message_id:
        description: PollMessageID is the ID of the original poll message
        type: string
      selected_options:
        description: SelectedOptions are the option names that were selected
        items:
          type: string
        type: array
    type: object
  whatsapp.ProtocolContent:
    properties:
      target_message_id:
        description: TargetMessageID is the ID of the affected message (for revoke)
        type: string
      type:
        description: Type is the protocol message type ("revoke", "ephemeral_setting",
          etc.)
        type: string
    type: object
  whatsapp.QuotedMessage:
    properties:
      chat_id:
        description: |-
          ChatID is ContextInfo.RemoteJID, set only for cross-chat quotes such as
          status replies
        type: string
      from_me:
        description: FromMe indicates the quoted message was sent by this device
        type: boolean
      message_id:
        description: MessageID is the WhatsApp stanza ID of the quoted message
        type: string
      participant:
        description: |-
          Participant is the JID of the quoted message's sender. Required to render
          group replies, and required to build a valid outbound quote.
        type: string
      preview:
        description: |-
          Preview is a short text or caption excerpt so consumers can render a
          quote bubble without a database lookup
        type: string
      type:
        description: |-
          Type is the quoted message's type, using the same vocabulary as
          MessagePayload.Type
        type: string
    type: object
  whatsapp.ReactionContent:
    properties:
      emoji:
        description: Emoji is the emoji used for the reaction (empty string means
          removed)
        type: string
      target_message_id:
        description: TargetMessageID is the ID of the message being reacted to
        type: string
      target_sender:
        description: TargetSender is the sender of the target message
        type: string
    type: object
  whatsapp.SendFileMessageRequest:
    properties:
      caption:
        type: string
      chat_id:
        type: string
      device_id:
        type: string
      duration:
        type: integer
      file_url:
        type: string
      is_forwarded:
        type: boolean
      reply_message_id:
        type: string
      reply_participant:
        description: |-
          ReplyParticipant is the JID of the quoted message's sender. Optional:
          when empty it is resolved from the message cache, or inferred for DMs.
        type: string
    type: object
  whatsapp.SendImageMessageRequest:
    properties:
      caption:
        type: string
      chat_id:
        type: string
      device_id:
        type: string
      duration:
        type: integer
      file_url:
        type: string
      is_forwarded:
        type: boolean
      reply_message_id:
        type: string
      reply_participant:
        description: |-
          ReplyParticipant is the JID of the quoted message's sender. Optional:
          when empty it is resolved from the message cache, or inferred for DMs.
        type: string
      view_once:
        type: boolean
    type: object
  whatsapp.SendPresenceRequest:
    properties:
      chat_id:
        type: string
      device_id:
        type: string
      is_forwarded:
        type: boolean
    type: object
  whatsapp.SendReactionRequest:
    properties:
      chat_id:
        type: string
      device_id:
        type: string
      emoji:
        type: string
      is_forwarded:
        type: boolean
      message_id:
        type: string
    type: object
  whatsapp.SendTextMessageRequest:
    properties:
      chat_id:
        type: string
      device_id:
        type: string
      duration:
        type: integer
      is_forwarded:
        type: boolean
      message:
        type: string
      reply_message_id:
        type: string
      reply_participant:
        description: |-
          ReplyParticipant is the JID of the quoted message's sender. Optional:
          when empty it is resolved from the message cache, or inferred for DMs.
        type: string
    type: object
  whatsapp.SendVideoMessageRequest:
    properties:
      caption:
        type: string
      chat_id:
        type: string
      device_id:
        type: string
      duration:
        type: integer
      file_url:
        type: string
      is_forwarded:
        type: boolean
      reply_message_id:
        type: string
      reply_participant:
        description: |-
          ReplyParticipant is the JID of the quoted message's sender. Optional:
          when empty it is resolved from the message cache, or inferred for DMs.
        type: string
      view_once:
        type: boolean
    type: object
  whatsapp.StickerContent:
    properties:
      caption:
        description: Caption is the optional sticker caption (rarely used)
        type: string
      media:
        allOf:
        - $ref: '#/definitions/whatsapp.MediaData'
        description: Media contains the downloaded sticker data and metadata (preferred)
      mimetype:
        description: Mimetype is the sticker MIME type (e.g., "image/webp")
        type: string
      url:
        description: URL is the WhatsApp media URL for the sticker (DEPRECATED - use
          Media field instead)
        type: string
    type: object
  whatsapp.TextContent:
    properties:
      content:
        description: Content is the actual text message
        type: string
    type: object
  whatsapp.VideoContent:
    properties:
      caption:
        description: Caption is the optional video caption
        type: string
      media:
        allOf:
        - $ref: '#/definitions/whatsapp.MediaData'
        description: Media contains the downloaded video data and metadata (preferred)
      mimetype:
        description: Mimetype is the video MIME type (e.g., "video/mp4")
        type: string
      url:
        description: URL is the WhatsApp media URL for the video (DEPRECATED - use
          Media field instead)
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for managing WhatsApp devices and sending messages
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: WhatsApp Gateway API
  version: "1.0"
paths:
  /device:
    get:
      consumes:
      - application/json
      description: Returns a list of all registered WhatsApp devices
      produces:
      - application/json
      responses:
        "200":
          description: List of devices with id and status
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: Get all devices
      tags:
      - Device
  /device/new:
    post:
      consumes:
      - application/json
      description: Creates a new WhatsApp device and returns a QR code for authentication.
        You can optionally provide a device_id, otherwise one will be auto-generated.
      parameters:
      - description: Device creation request
        in: body
        name: request
        schema:
          $ref: '#/definitions/http.CreateDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns device_id and base64 encoded QR code
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or device ID already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create new WhatsApp device
      tags:
      - Device
  /message/emoji:
    post:
      consumes:
      - application/json
      description: Sends an emoji reaction to a specific message in a WhatsApp chat
      parameters:
      - description: Reaction request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/whatsapp.SendReactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reaction sent successfully
          schema:
            $ref: '#/definitions/whatsapp.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send emoji reaction
      tags:
      - Message
  /message/file:
    post:
      consumes:
      - application/json
      description: Sends a file/document message to a WhatsApp chat
      parameters:
      - description: File message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/whatsapp.SendFileMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: File sent successfully
          schema:
            $ref: '#/definitions/whatsapp.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send file message
      tags:
      - Message
  /message/history:
    post:
      consumes:
      - application/json
      description: Requests message history from the user's primary WhatsApp device.
        The response indicates the request was sent. Actual messages will arrive via
        events.HistorySync events and webhooks. Supports pagination using before_message_id.
      parameters:
      - description: 'Message history request with device_id, chat_id, optional before_message_id
          for pagination, and count (default: 50, max: 100)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/whatsapp.FetchMessageHistoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: History sync request sent successfully. Contains request_id
            for tracking.
          schema:
            $ref: '#/definitions/whatsapp.MessageHistoryResponse'
        "400":
          description: Invalid request body or parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error or device not connected
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch message history
      tags:
      - Message
  /message/image:
    post:
      consumes:
      - application/json
      description: Sends an image message to a WhatsApp chat
      parameters:
      - description: Image message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/whatsapp.SendImageMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Image sent successfully
          schema:
            $ref: '#/definitions/whatsapp.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send image message
      tags:
      - Message
  /message/presence:
    post:
      consumes:
      - application/json
      description: Sends a typing indicator/presence update to a WhatsApp chat
      parameters:
      - description: Presence request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/whatsapp.SendPresenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Presence sent successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send presence update
      tags:
      - Message
  /message/text:
    post:
      consumes:
      - application/json
      description: Sends a text message to a WhatsApp chat
      parameters:
      - description: Text message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/whatsapp.SendTextMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Message sent successfully
          schema:
            $ref: '#/definitions/whatsapp.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send text message
      tags:
      - Message
  /message/video:
    post:
      consumes:
      - application/json
      description: Sends a video message to a WhatsApp chat
      parameters:
      - description: Video message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/whatsapp.SendVideoMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Video sent successfully
          schema:
            $ref: '#/definitions/whatsapp.MessageResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send video message
      tags:
      - Message
schemes:
- http
- https
swagger: "2.0"
